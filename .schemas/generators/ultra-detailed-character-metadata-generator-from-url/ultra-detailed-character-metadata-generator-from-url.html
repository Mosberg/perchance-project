    label { font-weight:600; margin-right:8px; }
    select, input[type="text"], textarea { width:100%; padding:8px; border:1px solid #ccc; border-radius:6px; }
    textarea { min-height:160px; font-family: monospace; font-size:13px; }
    button { padding:8px 12px; border-radius:8px; border:0; background:#0d8b78; color:#fff; cursor:pointer; }
    button:disabled { opacity:0.6; cursor:default; }
    .controls { display:flex; gap:8px; }
    .small { width:220px; }
    .muted { color:#556; font-size:13px; }
    .top { max-width:1100px; margin:0 auto; }
    .two-col { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }

<body>
  <div class="top">
    <h1>Ultra-Detailed Character Metadata Generator From URL</h1>
    <p class="muted">Paste one or more URLs, select a schema, and click Generate. Results are output as <code>{ "character": [...] }</code>.</p>

    <div class="row">
      <label for="schemaSelect">Schema Type</label>
      <select id="schemaSelect">
        <option value="ultra">Ultra‑Detailed Schema — ultra-detailed-character-metadata-v2.schema.json</option>
        <option value="nsfw">Ultra‑Detailed NSFW Schema — ultra-detailed-character-metadata-nsfw-v2.schema.json</option>
      </select>
    </div>

    <div style="margin-bottom:8px">
      <label for="urlInput">URL Input</label>
      <input id="urlInput" type="text" placeholder="https://example.com/character or comma/newline separated list" />
    </div>

    <div style="margin-bottom:8px">
      <label for="batchUrls">Or paste multiple URLs (one per line)</label>
      <textarea id="batchUrls" placeholder="https://example.com/char-a\nhttps://example.com/char-b"></textarea>
    </div>

    <div class="row">
      <label for="enableEditor">Enable JSON Editor</label>
      <input id="enableEditor" type="checkbox" />

      <label for="showValidation" style="margin-left:18px">Show Validation</label>
      <input id="showValidation" type="checkbox" />
    </div>

    <div class="controls" style="margin-bottom:14px">
      <button id="generateBtn">Generate</button>
      <button id="downloadBtn" disabled>Download JSON</button>
      <div class="muted" id="status">Idle</div>
    </div>

    <div class="two-col" style="margin-bottom:12px">
      <div>
        <label for="jsonOutput">JSON Output</label>
        <textarea id="jsonOutput" readonly placeholder="Generated metadata will appear here"></textarea>
      </div>
      <div>
        <label for="validationOutput">Validation Results</label>
        <textarea id="validationOutput" readonly placeholder="Validation messages will appear here"></textarea>
      </div>
    </div>
  </div>

    function setStatus(text) { els.status.textContent = text; }

    function parseUrlTextToList(single, batch) {
      const parts = [];
      if (single && single.trim()) {
        parts.push(...single.split(/\s*,\s*|\s+/).filter(Boolean));
      }
      if (batch && batch.trim()) {
        parts.push(...batch.split(/\r?\n|,|;/).map(s=>s.trim()).filter(Boolean));
      }
      return Array.from(new Set(parts.filter(u => /^https?:\/\//i.test(u))));
    }

    async function fetchTextFromUrl(url) {
      try {
        const res = await (rootRef.superFetch ? rootRef.superFetch(url) : fetch(url));
        const contentType = res.headers?.get ? res.headers.get('content-type') : (res.type || 'text/html');
        if (/pdf/i.test(contentType)) {
          return '[PDF content omitted]';
        }
        const text = await res.text();
        return text;
      } catch (error) {
        console.error('fetch error', error);
        return '';
      }
    }

    async function generateMetadataForUrl(url, schemaChoice, extraContext='') {
      setStatus(`Fetching ${url}...`);
      const content = await fetchTextFromUrl(url);
      setStatus(`Asking AI to extract metadata from ${url}...`);

      const schemaJson = SCHEMAS[schemaChoice] || SCHEMAS.ultra;

      const instruction = `You are a structured-data extractor.\n\nSTRICT REQUIREMENTS:\n- Return ONLY valid JSON and nothing else (no commentary, no markdown, no code fences).\n- The JSON MUST conform exactly to the provided JSON schema. Acceptable outputs: either 1) an object with a top-level "character" key whose value is an array of character objects that match the schema, or 2) a JSON array of character objects that match the schema.\n- All fields in the schema must appear for each character. If a value is unknown, use "" (empty string), [] (empty array), or {} (empty object) as appropriate. Do NOT emit null. Dates must be ISO-8601 strings or "". Keep long text concise (1-3 sentences) when summarizing.\n- For NSFW schema choose and populate the 'nsfw' fields when sexual/consent information is present; otherwise set 'nsfw' to an empty array.\n\nJSON_SCHEMA:\n${schemaJson}\n\nWEBPAGE_CONTENT:\n${content}\n\nADDITIONAL_CONTEXT:\n${extraContext}\n\nNow produce the required JSON output that strictly follows the schema.`;

      try {
        const response = await (rootRef.aiTextPlugin
          ? rootRef.aiTextPlugin({ instruction, startWith: '{' })
          : (async () => { return '{}'; })());

        let raw = (response || '').trim();
        raw = raw.replace(/```json\s*([\s\S]*?)```/, '$1').trim();
        try {
          const parsed = JSON.parse(raw);
          return parsed;
        } catch (err) {
          const first = raw.indexOf('{');
          const last = raw.lastIndexOf('}');
          if (first !== -1 && last !== -1 && last > first) {
            const sub = raw.slice(first, last + 1);
            try { return JSON.parse(sub); } catch (e) { /* fall through */ }
          }
          return { _rawAiResponse: raw, _sourceUrl: url };
        }
      } catch (error) {
        console.error(error);
        return { _error: String(error), _sourceUrl: url };
      }
    }

    function normalizeToCharacterArray(parsed) {
      if (!parsed) return [];
      if (Array.isArray(parsed)) return parsed;
      if (parsed.character && Array.isArray(parsed.character)) return parsed.character;
      const keys = Object.keys(parsed || {});
      if (keys.includes('identity') || keys.includes('appearance') || keys.includes('personality')) {
        return [parsed];
      }
      return [];
    }

    function validateCharacter(c, schemaChoice) {
      const errors = [];
      if (!c || typeof c !== 'object') { errors.push('Not an object'); return { valid:false, errors }; }
      if (!c.identity || typeof c.identity !== 'object') {
        errors.push('identity is required and must be an object');
      } else {
        if (!c.identity.name || String(c.identity.name).trim() === '') errors.push('identity.name is required');
      }
      if (!c.appearance || typeof c.appearance !== 'object') {
        errors.push('appearance is required and must be an object');
      }
      if (schemaChoice === 'nsfw') {
        if (!Array.isArray(c.nsfw)) {
          errors.push('nsfw should be an array (can be empty) for NSFW schema');
        }
      }
      return { valid: errors.length === 0, errors };
    }

    async function generateHandler() {
      const urls = parseUrlTextToList(els.urlInput.value, els.batchUrls.value);
      if (urls.length === 0) { alert('Please provide at least one http(s) URL.'); return; }
      els.generateBtn.disabled = true;
      els.downloadBtn.disabled = true;
      setStatus('Starting generation...');

      const schemaChoice = els.schemaSelect.value;
      const allCharacters = [];
      const validationResults = [];

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        setStatus(`Processing ${i+1}/${urls.length}: ${url}`);
        const parsed = await generateMetadataForUrl(url, schemaChoice);
        const chars = normalizeToCharacterArray(parsed);
        if (chars.length === 0) {
          allCharacters.push({ _sourceUrl: url, _note: 'No character object extracted', _raw: parsed });
          validationResults.push({ index: i, valid: false, errors: ['No character object extracted'] });
        } else {
          for (const c of chars) {
            const candidate = (c.identity || c.appearance || c.personality) ? ({ ...c, _sourceUrl: url }) : ({ identity: { name: c.name || '' }, ...c, _sourceUrl: url });
            allCharacters.push(candidate);
            const vr = validateCharacter(candidate, schemaChoice);
            validationResults.push({ index: i, valid: vr.valid, errors: vr.errors });
          }
        }
        await new Promise(r => setTimeout(r, 250));
      }

      const finalOutput = { character: allCharacters };
      els.jsonOutput.value = JSON.stringify(finalOutput, null, 2);
      els.jsonOutput.readOnly = !els.enableEditor.checked;

      // Show validation output if requested
      if (els.showValidation.checked) {
        const lines = validationResults.map((r, idx) => {
          return `URL #${r.index+1} (${urls[r.index]}): ` + (r.valid ? '✔ Valid' : `✖ Invalid\n  - ${r.errors.join('\n  - ')}`);
        });
        els.validationOutput.value = lines.join('\n\n');
      } else {
        els.validationOutput.value = '';
      }

      els.downloadBtn.disabled = false;
      setStatus(`Generated ${allCharacters.length} character(s).`);
      els.generateBtn.disabled = false;
      try { if (rootRef.generatorStats) rootRef.generatorStats(null, 'views'); } catch (e) {}
    }

    function downloadJson() {
      const text = els.jsonOutput.value || JSON.stringify({ character: [] }, null, 2);
      const blob = new Blob([text], { type: 'application/json' });
      const name = `ultra-characters-${new Date().toISOString().slice(0,10)}.json`;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setStatus(`Downloaded ${name}`);
    }

    els.generateBtn.addEventListener('click', generateHandler);
    els.downloadBtn.addEventListener('click', downloadJson);
    els.enableEditor.addEventListener('change', () => {
      els.jsonOutput.readOnly = !els.enableEditor.checked;
    });

    try { if (rootRef.aiTextPlugin) rootRef.aiTextPlugin({ preload: true }); } catch (e) {}

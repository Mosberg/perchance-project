<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Neon MIDI</title>
  </head>
  <body>
    <div
      id="appCtn"
      style="
        width: 100%;
        height: 100vh;
        background: #050505;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
        color: white;
      "
    >
      <div
        id="startOverlayEl"
        style="
          position: absolute;
          inset: 0;
          background: rgba(0, 0, 0, 0.85);
          z-index: 100;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          cursor: pointer;
        "
      >
        <h1
          style="
            font-size: 3rem;
            text-shadow: 0 0 20px cyan;
            margin-bottom: 10px;
          "
        >
          NEON MIDI
        </h1>
        <p style="color: #aaa">Click anywhere to enable Audio & MIDI</p>
      </div>

      <div
        id="hudEl"
        style="
          position: absolute;
          top: 20px;
          left: 20px;
          z-index: 10;
          pointer-events: none;
          text-shadow: 0 2px 4px black;
          font-weight: bold;
        "
      >
        <div style="font-size: 1.5rem">
          Streak: <span id="streakEl" style="color: cyan">0</span>
        </div>
        <div style="font-size: 1rem; opacity: 0.8">
          Accuracy: <span id="accuracyEl">0%</span> | Best:
          <span id="bestStreakEl">0</span>
        </div>
      </div>

      <button
        id="settingsBtn"
        onclick="toggleSettings()"
        style="
          position: absolute;
          top: 20px;
          right: 20px;
          z-index: 10;
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.2);
          color: white;
          padding: 10px 20px;
          border-radius: 20px;
          cursor: pointer;
          backdrop-filter: blur(5px);
        "
      >
        ⚙️ Settings
      </button>

      <div
        id="settingsPanel"
        hidden
        style="
          position: absolute;
          top: 70px;
          right: 20px;
          width: 320px;
          background: rgba(20, 20, 20, 0.95);
          border: 1px solid #444;
          padding: 20px;
          border-radius: 10px;
          z-index: 10;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        "
      >
        <h3
          style="
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
          "
        >
          Settings
        </h3>

        <div style="margin-bottom: 15px">
          <label style="display: block; font-size: 0.8rem; color: #aaa"
            >MIDI Device</label
          >
          <select
            id="midiSelect"
            style="
              width: 100%;
              background: #222;
              color: white;
              border: 1px solid #444;
              padding: 5px;
            "
          >
            <option value="auto">Auto-detect</option>
          </select>
        </div>

        <div style="margin-bottom: 15px">
          <label style="display: block; font-size: 0.8rem; color: #aaa"
            >MIDI Channel (1–16)</label
          >
          <input
            type="range"
            id="channelInput"
            min="1"
            max="16"
            value="1"
            oninput="setChannel(this.value)"
            style="width: 100%"
          />
          <div id="channelVal" style="text-align: right; font-size: 0.8rem">
            1
          </div>
        </div>

        <div style="margin-bottom: 15px">
          <label style="display: block; font-size: 0.8rem; color: #aaa"
            >Instrument</label
          >
          <select
            id="instrumentSelect"
            onchange="changeInstrument()"
            style="
              width: 100%;
              background: #222;
              color: white;
              border: 1px solid #444;
              padding: 5px;
            "
          >
            <option value="0">Grand Piano</option>
            <option value="4">Electric Piano</option>
            <option value="3">Honky-tonk</option>
            <option value="19">Organ</option>
            <option value="48">Strings</option>
            <option value="80">Synth Lead</option>
            <option value="88">Synth Pad</option>
            <option value="6">Harpsichord</option>
            <option value="11">Vibraphone</option>
            <option value="10">Music Box</option>
          </select>
        </div>

        <div style="margin-bottom: 15px">
          <label style="display: block; font-size: 0.8rem; color: #aaa"
            >Master Volume</label
          >
          <input
            type="range"
            id="volumeInput"
            min="-40"
            max="6"
            value="-10"
            oninput="setVolume(this.value)"
            style="width: 100%"
          />
        </div>

        <div style="margin-bottom: 15px">
          <label style="display: block; font-size: 0.8rem; color: #aaa"
            >Transpose (Semitones)</label
          >
          <input
            type="range"
            id="transposeInput"
            min="-24"
            max="24"
            value="0"
            oninput="setTranspose(this.value)"
            style="width: 100%"
          />
          <div id="transposeVal" style="text-align: right; font-size: 0.8rem">
            0
          </div>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
          "
        >
          <span style="font-size: 0.9rem">Show Accuracy</span>
          <input type="checkbox" id="accuracyToggle" checked />
        </div>
      </div>

      <canvas
        id="visualizerCanvasEl"
        style="flex: 1; width: 100%; height: 100%"
      ></canvas>

      <div
        id="keyboardWrapperEl"
        style="
          height: 25vh;
          position: relative;
          background: #111;
          border-top: 4px solid #333;
        "
      >
        <div
          id="keyboardCtn"
          style="
            position: relative;
            height: 100%;
            width: 100%;
            transform-origin: center bottom;
            transition: transform 0.3s ease;
          "
        ></div>
      </div>

      <style>
        .white-key {
          position: absolute;
          top: 0;
          height: 100%;
          background: linear-gradient(to bottom, #fff 0%, #eee 100%);
          border: 1px solid #999;
          border-radius: 0 0 5px 5px;
          z-index: 1;
          cursor: pointer;
          box-shadow: inset 0 -5px 10px rgba(0, 0, 0, 0.2);
          user-select: none;
        }
        .white-key:active,
        .white-key.active {
          transform: scaleY(0.98);
          transform-origin: top;
          background: #ddd;
          box-shadow: 0 0 15px cyan;
          border-color: cyan;
        }
        .black-key {
          position: absolute;
          top: 0;
          height: 60%;
          background: linear-gradient(to bottom, #333 0%, #000 100%);
          border: 1px solid #000;
          border-radius: 0 0 3px 3px;
          z-index: 2;
          cursor: pointer;
          box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
          user-select: none;
        }
        .black-key:active,
        .black-key.active {
          transform: scaleY(0.96);
          transform-origin: top;
          background: #111;
          box-shadow: 0 0 15px magenta;
          border-color: magenta;
        }

        .hit-green {
          background: #0f0 !important;
          box-shadow: 0 0 20px #0f0 !important;
        }
        .hit-red {
          background: #f00 !important;
          box-shadow: 0 0 20px #f00 !important;
        }
        .hit-blue {
          background: #0ff !important;
          box-shadow: 0 0 20px #0ff !important;
        }
      </style>

      <script type="module">
        import * as Tone from "https://esm.sh/tone@15.0.4";

        // Expose to window
        window.toggleSettings = () =>
          (settingsPanel.hidden = !settingsPanel.hidden);
        window.changeInstrument = () => loadInstrument(instrumentSelect.value);
        window.setVolume = (val) => {
          if (synth) synth.volume.value = parseFloat(val);
        };
        window.setTranspose = (val) => {
          transpose = parseInt(val);
          transposeVal.textContent = val;
        };
        window.setChannel = (val) => {
          midiChannel = parseInt(val);
          channelVal.textContent = val;
        };

        // State
        let synth;
        let midiAccess = null;
        const midiInputs = new Map(); // id -> port
        let selectedInputId = "auto";
        let transpose = 0;
        let midiChannel = 1; // 1–16 = filtered; 0 = all channels (not used here)
        let isSustained = false;
        const sustainPedalNotes = new Set();
        const START_OCTAVE = 2;
        const NUM_OCTAVES = 5;
        const TOTAL_KEYS = NUM_OCTAVES * 12;
        const START_NOTE = START_OCTAVE * 12; // C2 (MIDI 24)
        const fallingNotes = [];
        const score = { hits: 0, misses: 0, streak: 0, bestStreak: 0 };

        // DOM elements
        const canvas = visualizerCanvasEl;
        const ctx = canvas.getContext("2d");
        const startOverlay = startOverlayEl;
        const midiSelect = document.getElementById("midiSelect");
        const channelInput = document.getElementById("channelInput");
        const channelVal = document.getElementById("channelVal");
        const instrumentSelect = document.getElementById("instrumentSelect");
        const volumeInput = document.getElementById("volumeInput");
        const transposeInput = document.getElementById("transposeInput");
        const transposeVal = document.getElementById("transposeVal");
        const accuracyToggle = document.getElementById("accuracyToggle");
        const keyboardCtn = document.getElementById("keyboardCtn");
        const keyboardWrapper = document.getElementById("keyboardWrapperEl");
        const settingsPanel = document.getElementById("settingsPanel");
        const streakEl = document.getElementById("streakEl");
        const accuracyEl = document.getElementById("accuracyEl");
        const bestStreakEl = document.getElementById("bestStreakEl");

        // === Initialization ===
        startOverlay.onclick = async () => {
          try {
            await Tone.start();
            await Tone.context.resume();
          } catch (e) {
            console.warn("Tone start error", e);
          }
          startOverlay.hidden = true;
          initAudio();
          await initMIDI();
          resize();
          requestAnimationFrame(loop);
          startSong();
        };

        function initAudio() {
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 1 },
          }).toDestination();
          synth.volume.value = -10;
          volumeInput.addEventListener("input", () => {
            synth.volume.value = parseFloat(volumeInput.value);
          });
        }

        // === Instrument presets (GM-like) ===
        function loadInstrument(gmId) {
          if (!synth) return;
          const id = parseInt(gmId);
          let opts = {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 1 },
          };
          switch (id) {
            case 0: // Grand Piano
              opts = {
                oscillator: { type: "custom", partials: [1, 0.5, 0.25] },
                envelope: {
                  attack: 0.01,
                  decay: 0.3,
                  sustain: 0.2,
                  release: 1.5,
                },
              };
              break;
            case 4: // Electric Piano
              opts = {
                oscillator: { type: "sine" },
                envelope: {
                  attack: 0.01,
                  decay: 0.5,
                  sustain: 0.4,
                  release: 1,
                },
              };
              break;
            case 3: // Honky-tonk
              opts = {
                oscillator: { type: "triangle" },
                envelope: {
                  attack: 0.01,
                  decay: 0.1,
                  sustain: 0.1,
                  release: 0.5,
                },
              };
              break;
            case 19: // Organ
              opts = {
                oscillator: { type: "square" },
                envelope: {
                  attack: 0.05,
                  decay: 0.0,
                  sustain: 0.8,
                  release: 0.1,
                },
              };
              break;
            case 48: // Strings
              opts = {
                oscillator: { type: "sawtooth" },
                envelope: {
                  attack: 0.5,
                  decay: 0.2,
                  sustain: 0.6,
                  release: 1.5,
                },
              };
              break;
            case 80: // Synth Lead
              opts = {
                oscillator: { type: "sawtooth" },
                envelope: {
                  attack: 0.01,
                  decay: 0.2,
                  sustain: 0.5,
                  release: 0.5,
                },
              };
              break;
            case 88: // Synth Pad
              opts = {
                oscillator: { type: "sine" },
                envelope: {
                  attack: 1.0,
                  decay: 0.5,
                  sustain: 0.8,
                  release: 2.0,
                },
              };
              break;
            case 6: // Harpsichord
              opts = {
                oscillator: { type: "square" },
                envelope: {
                  attack: 0.001,
                  decay: 0.5,
                  sustain: 0.0,
                  release: 0.5,
                },
              };
              break;
            case 11: // Vibraphone
              opts = {
                oscillator: { type: "sine" },
                envelope: {
                  attack: 0.001,
                  decay: 1.5,
                  sustain: 0.0,
                  release: 1.5,
                },
              };
              break;
            case 10: // Music Box
              opts = {
                oscillator: { type: "sine" },
                envelope: {
                  attack: 0.005,
                  decay: 0.8,
                  sustain: 0.0,
                  release: 1.0,
                },
              };
              break;
          }
          synth.set(opts);
        }

        // === MIDI handling ===
        async function initMIDI() {
          if (!navigator.requestMIDIAccess) {
            console.warn("Web MIDI API not available.");
            return;
          }
          try {
            midiAccess = await navigator.requestMIDIAccess({ sysex: false });
            midiAccess.inputs.forEach(registerInput);
            midiAccess.onstatechange = (e) => {
              if (e.port && e.port.type === "input") {
                if (e.port.state === "connected") registerInput(e.port);
                if (e.port.state === "disconnected") unregisterInput(e.port);
              }
            };
            populateMIDIDevices();
          } catch (err) {
            console.warn("MIDI access error", err);
          }
        }

        function registerInput(port) {
          midiInputs.set(port.id, port);
          port.onmidimessage = (msg) => midiMessageHandler(port.id, msg);
          populateMIDIDevices();
          if (selectedInputId === "auto" && midiInputs.size === 1) {
            selectMIDIInput(port.id);
          }
        }

        function unregisterInput(port) {
          midiInputs.delete(port.id);
          populateMIDIDevices();
          if (selectedInputId === port.id) {
            selectedInputId = "auto";
          }
        }

        function populateMIDIDevices() {
          while (midiSelect.firstChild)
            midiSelect.removeChild(midiSelect.firstChild);
          const autoOpt = document.createElement("option");
          autoOpt.value = "auto";
          autoOpt.text = "Auto-detect";
          midiSelect.add(autoOpt);
          midiInputs.forEach((port, id) => {
            const opt = document.createElement("option");
            opt.value = id;
            opt.text = port.name || port.id;
            midiSelect.add(opt);
          });
          midiSelect.value = selectedInputId;
          midiSelect.addEventListener("change", () => {
            selectedInputId = midiSelect.value;
          });
        }

        function selectMIDIInput(id) {
          selectedInputId = id;
          midiSelect.value = id;
        }

        function midiMessageHandler(inputId, message) {
          if (selectedInputId !== "auto" && selectedInputId !== inputId) return;

          const data = message.data;
          const [status, data1, data2] = data;
          const cmd = status & 0xf0;
          const channel = (status & 0x0f) + 1; // 1–16
          const note = data1;
          const vel = data2;

          // MIDI channel filter
          if (midiChannel > 0 && channel !== midiChannel) {
            return;
          }

          // Sustain pedal (CC 64)
          if (cmd === 0xb0 && note === 64) {
            isSustained = vel >= 64;
            if (!isSustained) releaseSustainedNotes();
            return;
          }

          // Note On
          if (cmd === 0x90 && vel > 0) {
            const noteNum = note + transpose;
            handleNoteOn(noteNum, vel / 127);
            return;
          }

          // Note Off (explicit 0x80 or NoteOn vel=0)
          if (cmd === 0x80 || (cmd === 0x90 && vel === 0)) {
            const noteNum = note + transpose;
            handleNoteOff(noteNum);
            return;
          }
        }

        function handleNoteOn(note, velocity) {
          // Always play audio for any MIDI note (full 0–127 range)
          if (synth) {
            synth.triggerAttack(
              Tone.Frequency(note, "midi").toFrequency(),
              undefined,
              velocity,
            );
          }

          const keyEl = getKeyEl(note);
          if (keyEl) {
            keyEl.classList.add("active");
          }

          // Game logic only for notes inside the on‑screen 5‑octave keyboard
          if (note < START_NOTE || note >= START_NOTE + TOTAL_KEYS) {
            return; // sound yes, but no hit / miss
          }
          checkHit(note);
        }

        function handleNoteOff(note) {
          if (synth) {
            synth.triggerRelease(Tone.Frequency(note, "midi").toFrequency());
          }
          const keyEl = getKeyEl(note);
          if (keyEl) {
            keyEl.classList.remove("active");
          }
        }

        function releaseSustainedNotes() {
          sustainPedalNotes.forEach((n) => {
            handleNoteOff(n);
          });
          sustainPedalNotes.clear();
        }

        // === Keyboard generation ===
        function generateKeyboard() {
          keyboardCtn.innerHTML = "";
          const whiteNotes = [0, 2, 4, 5, 7, 9, 11];
          const blackNotes = [1, 3, 6, 8, 10];
          let whiteKeyCount = 0;
          const whiteKeyWidth = 100 / (NUM_OCTAVES * 7);

          for (let i = 0; i < TOTAL_KEYS; i++) {
            const midiNote = START_NOTE + i;
            const noteInOctave = midiNote % 12;
            const isBlack = blackNotes.includes(noteInOctave);
            const el = document.createElement("div");
            el.dataset.note = midiNote;

            if (!isBlack) {
              el.className = "white-key";
              el.style.left = whiteKeyCount * whiteKeyWidth + "%";
              el.style.width = whiteKeyWidth - 0.25 + "%";
              whiteKeyCount++;
            } else {
              el.className = "black-key";
              el.style.left =
                (whiteKeyCount - 1) * whiteKeyWidth +
                whiteKeyWidth * 0.65 +
                "%";
              el.style.width = whiteKeyWidth * 0.7 + "%";
            }

            el.onpointerdown = (e) => {
              e.preventDefault();
              const pointer = e.pointerId;
              const keyNote = parseInt(el.dataset.note);
              handleNoteOn(keyNote, 0.9);
              el.__pointerId = pointer;
            };

            el.onpointerup = (e) => {
              e.preventDefault();
              const keyNote = parseInt(el.dataset.note);
              if (el.__pointerId === e.pointerId) {
                delete el.__pointerId;
                handleNoteOff(keyNote);
              }
            };

            el.onpointerleave = (e) => {
              if (e.pressure === 0 && el.__pointerId === e.pointerId) {
                const keyNote = parseInt(el.dataset.note);
                delete el.__pointerId;
                handleNoteOff(keyNote);
              }
            };

            keyboardCtn.appendChild(el);
          }
        }
        generateKeyboard();

        function getKeyEl(note) {
          return keyboardCtn.querySelector(`div[data-note="${note}"]`);
        }

        // === Visuals / Game Logic ===
        function getNoteColor(note) {
          const hue = (note % 12) * 30;
          return `hsl(${hue}, 100%, 50%)`;
        }

        function startSong() {
          setInterval(() => {
            const note = START_NOTE + Math.floor(Math.random() * TOTAL_KEYS);
            fallingNotes.push({
              note,
              y: -80,
              hit: false,
              missed: false,
              color: getNoteColor(note),
            });
          }, 300);
        }

        function checkHit(playedNote) {
          const hitLineY = canvas.height * 0.85;
          const hitWindow = 60;

          let targetIndex = -1;
          for (let i = 0; i < fallingNotes.length; i++) {
            const n = fallingNotes[i];
            if (
              n.note === playedNote &&
              !n.hit &&
              !n.missed &&
              Math.abs(n.y - hitLineY) < hitWindow
            ) {
              targetIndex = i;
              break;
            }
          }

          const keyEl = getKeyEl(playedNote);
          if (!keyEl) return;

          if (targetIndex !== -1) {
            fallingNotes[targetIndex].hit = true;
            score.hits++;
            score.streak++;
            if (score.streak > score.bestStreak) {
              score.bestStreak = score.streak;
            }
            updateHUD();
            keyEl.classList.add("hit-green");
            setTimeout(() => keyEl.classList.remove("hit-green"), 200);
          } else {
            keyEl.classList.add("hit-blue");
            setTimeout(() => keyEl.classList.remove("hit-blue"), 200);
          }
        }

        function updateHUD() {
          streakEl.textContent = score.streak;
          const total = score.hits + score.misses;
          const acc = total === 0 ? 0 : Math.round((score.hits / total) * 100);
          accuracyEl.textContent = acc + "%";
          bestStreakEl.textContent = score.bestStreak;
        }

        // === Main loop / draw ===
        function loop() {
          if (!canvas.width) resize();
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const hitLineY = canvas.height * 0.85;

          for (let i = fallingNotes.length - 1; i >= 0; i--) {
            const n = fallingNotes[i];
            const keyEl = getKeyEl(n.note);

            if (!n.hit && !n.missed) n.y += 4;
            else n.y += 4;

            if (!n.hit && !n.missed && n.y > hitLineY + 60) {
              n.missed = true;
              score.misses++;
              score.streak = 0;
              updateHUD();
              const key = getKeyEl(n.note);
              if (key) {
                key.classList.add("hit-red");
                setTimeout(() => key.classList.remove("hit-red"), 200);
              }
            }

            if (n.y < canvas.height + 80) {
              if (keyEl) {
                const keyRect = keyEl.getBoundingClientRect();
                const containerRect = keyboardWrapper.getBoundingClientRect();
                const keyCenterX =
                  (keyRect.left + keyRect.right) / 2 - containerRect.left;
                const x = (keyCenterX / containerRect.width) * canvas.width;
                const w = (keyRect.width / containerRect.width) * canvas.width;

                ctx.fillStyle = n.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = n.color;
                const h = 60;
                roundRect(ctx, x - w / 2, n.y, Math.max(6, w), h, 6);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = "rgba(255,255,255,0.25)";
                ctx.fillRect(x - w / 2 + 2, n.y + 2, Math.max(2, w - 4), 10);
              }
            } else {
              fallingNotes.splice(i, 1);
            }

            // Approach glow
            if (!n.hit && !n.missed && keyEl) {
              const dist = Math.abs(n.y - hitLineY);
              if (dist < 150) {
                const opacity = 1 - dist / 150;
                keyEl.style.boxShadow = `0 0 ${10 + opacity * 20}px ${n.color}`;
                keyEl.style.borderColor = n.color;
              } else {
                keyEl.style.boxShadow = "";
                keyEl.style.borderColor = "";
              }
            }
          }

          // Draw hit line
          ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, hitLineY);
          ctx.lineTo(canvas.width, hitLineY);
          ctx.stroke();

          requestAnimationFrame(loop);
        }

        function resize() {
          canvas.width = canvas.parentElement.clientWidth;
          canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener("resize", resize);

        // util
        function roundRect(ctx, x, y, w, h, r) {
          const min = Math.min(w, h) / 2;
          if (r > min) r = min;
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }
      </script>
    </div>
